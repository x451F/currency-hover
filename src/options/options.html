<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Hover Options</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Currency Hover</h1>
        <p>Configure conversion behavior, caching, and tooltip settings.</p>
      </header>

      <section class="panel">
        <h2>General</h2>
        <label class="toggle">
          <input type="checkbox" id="enabled" />
          <span>Enable extension</span>
        </label>

        <div class="field">
          <label for="base">Base currency</label>
          <select id="base"></select>
        </div>

        <div class="field">
          <label for="targets">Target currencies</label>
          <select id="targets" multiple size="8"></select>
        </div>

        <label class="toggle">
          <input type="checkbox" id="detect-currency" />
          <span>Detect currency from selection</span>
        </label>
      </section>

      <section class="panel">
        <h2>Favorites</h2>
        <div class="favorites-list" id="favorites-list" aria-live="polite"></div>
        <div class="field">
          <label for="favorite-add">Add favorite</label>
          <div class="inline">
            <select id="favorite-add"></select>
            <button id="favorite-add-btn" class="ghost small" type="button">Add</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Tooltip</h2>
        <div class="field">
          <label for="auto-hide">Auto-hide after (seconds)</label>
          <input type="number" id="auto-hide" min="1" max="30" step="1" />
        </div>
        <label class="toggle">
          <input type="checkbox" id="show-date" />
          <span>Show rate date</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="compact" />
          <span>Compact mode</span>
        </label>
      </section>

      <section class="panel">
        <h2>Caching</h2>
        <div class="field">
          <label for="ttl">Cache TTL (minutes)</label>
          <input type="number" id="ttl" min="1" max="1440" step="1" />
        </div>
      </section>

      <section class="panel">
        <h2>Appearance</h2>
        <div class="field">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
