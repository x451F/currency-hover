<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Hover</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app" data-view="converter">
      <header class="header">
        <div>
          <div class="title">Currency Hover</div>
          <div class="subtitle">Convert across favorites</div>
        </div>
        <div class="header-actions">
          <button id="open-history" class="icon-btn" type="button" aria-label="Open history">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="13" r="8"></circle>
              <path d="M12 9v5l3 2"></path>
              <path d="M9 2h6"></path>
              <path d="M12 2v3"></path>
            </svg>
          </button>
          <button id="open-settings" class="icon-btn" type="button" aria-label="Open settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section id="converter-view" class="view">
        <div id="group-switcher" class="group-switcher hidden">
          <label for="group-select">Group</label>
          <select id="group-select" class="select"></select>
          <button id="manage-groups" class="ghost small" type="button">Manage</button>
        </div>
        <div class="card">
          <div id="converter-list" class="converter-list"></div>
          <div id="converter-error" class="inline-error" role="status" aria-live="polite"></div>
          <div class="add-row">
            <button id="add-currency-btn" class="ghost small" type="button">+ Add currency</button>
          </div>
          <div id="currency-picker" class="picker hidden">
            <input
              id="currency-search"
              type="text"
              placeholder="Search currency..."
              autocomplete="off"
            />
            <div id="currency-options" class="picker-options"></div>
          </div>
        </div>

        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="detect-currency" />
            <span>Auto-detect currency from selection</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="show-date-quick" />
            <span>Show rate date</span>
          </label>
        </div>

        <div class="rates-row">
          <span id="rates-updated" class="rate-label">
            <span class="rate-dot" aria-hidden="true"></span>
            <span class="rate-text">Rates updated: --</span>
          </span>
          <button id="refresh" class="icon-btn" type="button" aria-label="Refresh rates">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 12a8 8 0 1 1-2.3-5.7"></path>
              <path d="M20 4v6h-6"></path>
            </svg>
          </button>
        </div>
        <div id="calculator-root" class="calculator-root"></div>
      </section>

      <section id="settings-view" class="view hidden">
        <div class="settings-header">
          <button id="back" class="icon-btn" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
          </button>
          <div class="settings-title">Settings</div>
        </div>

        <div class="section">
          <div class="section-title">Theme</div>
          <select id="theme" class="select">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="section">
          <div class="section-title">Favorites</div>
          <div id="favorites-list" class="favorites-list"></div>
          <div class="favorites-actions">
            <button id="favorites-add" class="ghost small" type="button">+ Add currency</button>
          </div>
          <div id="favorites-picker" class="picker hidden">
            <input
              id="favorites-search"
              type="text"
              placeholder="Search currency..."
              autocomplete="off"
            />
            <div id="favorites-options" class="picker-options"></div>
          </div>
        </div>

        <div class="section hidden" id="groups-section">
          <div class="section-title">Groups</div>
          <div id="groups-list" class="favorites-list"></div>
          <div class="favorites-actions">
            <button id="group-add" class="ghost small" type="button">+ Add group</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Tooltip</div>
          <div class="setting-row">
            <label for="auto-hide">Auto-hide</label>
            <select id="auto-hide" class="select">
              <option value="2">2s</option>
              <option value="4">4s</option>
              <option value="6">6s</option>
              <option value="8">8s</option>
              <option value="0">Never</option>
            </select>
          </div>
          <label class="toggle">
            <input type="checkbox" id="show-date" />
            <span>Show rate date</span>
          </label>
        </div>

        <div class="section">
          <div class="section-title">Number formatting</div>
          <div class="setting-row">
            <label for="format-mode">Display mode</label>
            <select id="format-mode" class="select">
              <option value="auto">Auto (recommended)</option>
              <option value="fixed">Fixed decimals</option>
            </select>
            <div class="helper-text">Auto: 2 decimals normally, more precision for small values.</div>
          </div>
          <div id="format-auto" class="setting-row">
            <label for="format-min">Min decimals</label>
            <div class="inline-fields">
              <input type="number" id="format-min" min="0" max="4" step="1" placeholder="Min" />
              <input type="number" id="format-max" min="0" max="6" step="1" placeholder="Max" />
            </div>
            <div class="helper-text">Max must be ≥ min.</div>
          </div>
          <div id="format-fixed" class="setting-row hidden">
            <label for="format-fixed-decimals">Decimals</label>
            <div class="slider-row">
              <input type="range" id="format-fixed-slider" min="0" max="8" step="1" />
              <span id="format-fixed-value">2</span>
            </div>
            <input type="number" id="format-fixed-decimals" min="0" max="8" step="1" />
          </div>
          <label class="toggle">
            <input type="checkbox" id="format-grouping" />
            <span>Group thousands</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="format-compact" />
            <span>Compact notation</span>
          </label>
          <div class="setting-row">
            <div class="helper-text">Preview: <span id="format-preview">1234.56</span></div>
          </div>
          <div class="setting-row">
            <label for="copy-mode">Copy values</label>
            <select id="copy-mode" class="select">
              <option value="default">Default</option>
              <option value="formatted">Formatted</option>
              <option value="raw">Raw</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="copy-decimals">Copy decimals</label>
            <div class="slider-row">
              <input type="range" id="copy-decimals" min="0" max="8" step="1" />
              <span id="copy-decimals-value">2</span>
            </div>
            <label class="toggle inline">
              <input type="checkbox" id="copy-include-code" />
              <span>Include currency code</span>
            </label>
            <label class="toggle inline">
              <input type="checkbox" id="copy-include-symbol" />
              <span>Include symbol</span>
            </label>
          </div>
          <div class="setting-row">
            <div class="helper-text">Copy preview: <span id="copy-preview">1234.56</span></div>
          </div>
        </div>

        <details class="section">
          <summary class="section-title">Advanced</summary>
          <div class="setting-row">
            <label for="ttl">Cache TTL (minutes)</label>
            <input type="number" id="ttl" min="1" max="1440" step="1" />
          </div>
          <div class="setting-row">
            <label class="toggle">
              <input type="checkbox" id="history-enabled" />
              <span>History enabled</span>
            </label>
            <label for="history-max">History max items</label>
            <input type="number" id="history-max" min="50" max="2000" step="50" />
          </div>
        </details>
      </section>

      <section id="history-view" class="view hidden">
        <div class="settings-header">
          <button id="history-back" class="icon-btn" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
          </button>
          <div class="settings-title">History</div>
          <button id="clear-history" class="ghost small" type="button">Clear</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
